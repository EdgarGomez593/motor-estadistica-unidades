name: Motor R - Sala Situacional

# El robot se despertará cuando reciba una señal externa llamada "ejecutar_sala"
on:
  repository_dispatch:
    types: [ejecutar_sala]

jobs:
  procesar_datos:
    runs-on: ubuntu-latest # Enciende un servidor rápido con Linux

    steps:
      - name: 1. Descargar archivos del proyecto
        uses: actions/checkout@v3

      - name: 2. Instalar el lenguaje R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: 3. Instalar librerías matemáticas y de Google
        run: |
          install.packages(c("googledrive", "googlesheets4", "dplyr", "stringr"))
        shell: Rscript {0}

      - name: 4. Ejecutar al Director de Orquesta
        run: Rscript director.R
