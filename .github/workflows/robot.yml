name: Motor R - Sala Situacional

on:
  repository_dispatch:
    types: [ejecutar_sala]

jobs:
  procesar_datos:
    runs-on: ubuntu-latest # Enciende un servidor rápido con Linux

    steps:
      - name: 1. Descargar archivos del proyecto
        uses: actions/checkout@v3

      - name: 2. Instalar el lenguaje R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
          use-public-rspm: true # 🚀 Truco 1: Descarga librerías ya ensambladas

      - name: 3. Activar Memoria Caché
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-paquetes-r
          restore-keys: ${{ runner.os }}-paquetes-r # 🚀 Truco 2: Guardar en el casillero

      - name: 4. Instalar librerías (Solo si no están en caché)
        run: |
          # 🚀 Truco 3: Si ya existe en memoria, salta la instalación
          if (!require("googledrive", quietly = TRUE)) install.packages("googledrive")
          if (!require("googlesheets4", quietly = TRUE)) install.packages("googlesheets4")
          if (!require("dplyr", quietly = TRUE)) install.packages("dplyr")
          if (!require("stringr", quietly = TRUE)) install.packages("stringr")
        shell: Rscript {0}

      - name: 5. Ejecutar al Director de Orquesta
        env:
          MODO_EJECUCION: ${{ github.event.client_payload.modo_ejecucion }}
          ID_CARPETA: ${{ github.event.client_payload.id_carpeta }}
          ID_SHEET: ${{ github.event.client_payload.id_sheet }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: Rscript principal.R
