name: 🏢 Motor Oficinas Técnicas

on:
  repository_dispatch:
    types: [ejecutar_oficinas]

jobs:
  procesar_datos:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v3
        
      - name: ⚙️ Instalar dependencias de Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: ⚙️ Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: 📦 Restaurar caché de paquetes
        uses: actions/cache@v3
        with:
          path: /opt/R/4.3.0/lib/R/library
          key: Linux-paquetes-r

      - name: 🛠️ Instalar librerías de R (Si no están en memoria)
        run: |
          Rscript -e "if (!require('googledrive')) install.packages('googledrive', repos='http://cran.rstudio.com/')"
          Rscript -e "if (!require('googlesheets4')) install.packages('googlesheets4', repos='http://cran.rstudio.com/')"
          Rscript -e "if (!require('dplyr')) install.packages('dplyr', repos='http://cran.rstudio.com/')"
          Rscript -e "if (!require('stringr')) install.packages('stringr', repos='http://cran.rstudio.com/')"

      - name: 🚀 Encender el Motor R (Oficinas Técnicas)
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          MODO_EJECUCION: ${{ github.event.client_payload.modo_ejecucion }}
          ID_CARPETA: ${{ github.event.client_payload.id_carpeta }}
          ID_SHEET: ${{ github.event.client_payload.id_sheet }}
        run: Rscript principal_oficinas.R
